[workspace]
resolver = "2"
members = ["crates/vulngraph-core", "crates/vulngraph-dataset", "crates/vulngraph-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/copyleftdev/vulngraph-cli"

[workspace.dependencies]
vulngraph-core = { path = "crates/vulngraph-core" }
vulngraph-dataset = { path = "crates/vulngraph-dataset" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
ureq = "2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
